name: Quality Checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Build
        run: pnpm build
      - name: Test
        run: pnpm test

  native-core:
    name: Native core (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Windows native tests
        if: runner.os == 'Windows'
        run: cmake -S native/xplane-plugin -B build/native -A x64
      - name: Configure Unix native tests
        if: runner.os != 'Windows'
        run: cmake -S native/xplane-plugin -B build/native -DCMAKE_BUILD_TYPE=Release
      - name: Build native tests
        run: cmake --build build/native --config Release
      - name: Run native tests
        run: ctest --test-dir build/native -C Release --output-on-failure
